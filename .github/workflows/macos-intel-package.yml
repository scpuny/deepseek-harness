name: Build Desktop macOS x64
on:
  workflow_dispatch:

jobs:
  package:
    runs-on: [self-hosted, macOS, X64, dsh-mac-package-trial]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: x86_64-apple-darwin

      - name: Install pnpm
        if: matrix.os == 'macos-13'
        run: npm install -g pnpm@11.28.5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check original machine archival route
        env:
          DESKTOP_PUBLISH_RUNNERS: dsh-mac-package-trial
        run: node --import tsx apps/desktop/scripts/retain-desktop-ci.ts --check-runner

      - name: Prepare macOS CI packaging env
        env:
          DSH_PACKAGING_CONFIG_DIR: ${{ github.workspace }}/apps/desktop
        run: node apps/desktop/scripts/prepare-macos-ci.mjs

      - name: Package mac-x64
        run: |
          BUILD_VERSION=$(node -p "require('./apps/desktop/package.json').version")
          echo "BUILD_VERSION=${BUILD_VERSION}"
          tsx apps/desktop/scripts/package-target.ts mac-x64 --check --build-version ${BUILD_VERSION} --skip-notarization

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-mac-x64-dmg
          path: apps/desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
